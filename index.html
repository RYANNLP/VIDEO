<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Descarga el video explicativo sobre los niveles de protección de datos en dispositivos móviles.">
  <title>Video explicativo | Protección de datos móviles</title>
  <style>
    :root {
      --bg: #090d19; --panel: rgba(21, 29, 52, .82);
      --text: #f4f6ff; --muted: #a7b2cc; --mint: #70f0d2; --purple: #9585ff;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh; margin: 0; padding: 24px; display: grid; place-items: center;
      color: var(--text); font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
      background: radial-gradient(ellipse at 12% 10%, #34266c 0, transparent 36%),
                  radial-gradient(ellipse at 90% 90%, #123e49 0, transparent 34%), var(--bg);
    }
    .card {
      width: min(100%, 520px); text-align: center; padding: clamp(25px, 6vw, 42px);
      border: 1px solid #ffffff1c; border-radius: 28px; background: var(--panel);
      box-shadow: 0 28px 90px #0008; backdrop-filter: blur(18px);
    }
    .symbol {
      width: 78px; height: 78px; margin: 0 auto 24px; display: grid; place-items: center;
      border-radius: 24px; color: #101526;
      background: linear-gradient(135deg, var(--mint), #a5f6e7);
      box-shadow: 0 10px 36px #70f0d233;
    }
    .symbol svg { width: 35px; height: 35px; }
    .tag { color: var(--mint); font-size: .75rem; font-weight: 800; letter-spacing: .17em; text-transform: uppercase; }
    h1 { font-size: clamp(1.65rem, 5vw, 2.25rem); line-height: 1.15; letter-spacing: -.04em; margin: 12px 0; }
    .intro { max-width: 380px; margin: 0 auto 26px; color: var(--muted); line-height: 1.65; }
    .file {
      display: flex; align-items: center; gap: 14px; text-align: left; padding: 16px;
      border: 1px solid #ffffff18; border-radius: 17px; background: #ffffff08; margin-bottom: 20px;
    }
    .file-icon { width: 48px; height: 48px; flex: 0 0 48px; display: grid; place-items: center;
      border-radius: 14px; background: #9585ff20; color: var(--purple); font-weight: 900; font-size: .8rem; }
    .file-info { min-width: 0; }
    .file-title { display: block; font-weight: 750; overflow-wrap: anywhere; }
    .file-sub { display: block; color: var(--muted); font-size: .82rem; margin-top: 5px; }
    .download {
      display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%;
      padding: 16px 20px; border-radius: 15px; border: 0; text-decoration: none;
      background: linear-gradient(100deg, var(--mint), #a5f6e7); color: #101526;
      font-weight: 850; font-size: 1rem; transition: transform .18s, filter .18s;
    }
    .download:hover { transform: translateY(-2px); filter: brightness(1.06); }
    .download svg { width: 20px; height: 20px; }
    .hint { margin: 17px 0 0; color: var(--muted); font-size: .78rem; line-height: 1.55; }
    footer { margin-top: 25px; color: #8792ad; font-size: .75rem; }
  </style>
</head>
<body>
  <main class="card">
    <div class="symbol" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="5" width="18" height="14" rx="3"></rect>
        <path d="m10 9 5 3-5 3z" fill="currentColor" stroke="none"></path>
      </svg>
    </div>
    <div class="tag">Video explicativo</div>
    <h1>Protección de datos en dispositivos móviles</h1>
    <p class="intro">Descarga el video de la explicación.</p>

    <div class="file">
      <div class="file-icon">▶</div>
      <div class="file-info">
        <span class="file-title">Video de la explicación</span>
        <span class="file-sub">Formato de video · Descarga directa</span>
      </div>
    </div>

    <a class="download" href="./video.mp4" download="Video-Proteccion-de-Datos-Moviles.mp4">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 3v12m-5-5 5 5 5-5"></path><path d="M5 17v3h14v-3"></path>
      </svg>
      Descargar video
    </a>
    <p class="hint">Pulsa el botón para guardar el video en tu dispositivo.</p>
    <footer>Trabajo escolar · Seguridad de la información</footer>
  </main>
</body>
</html>
